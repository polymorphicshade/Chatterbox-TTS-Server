# Reverse proxy for Chatterbox TTS Server.
#
# Mounted read-only at /etc/nginx/conf.d/default.conf, so edits take effect with
#   docker compose -f docker-compose.https.yml restart nginx
# and never need an image rebuild.
#
# Point NGINX_CONF at a copy of this file to override it without editing it.

server {
    # No IPv6 listener: the default compose bridge network often has no IPv6,
    # and nginx refuses to start if it can't bind the socket.
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Reference audio and voice uploads can be large; 0 removes the cap entirely.
    client_max_body_size 0;

    location / {
        # <- the only line to change when reusing this for another service.
        #    "chatterbox-tts-server" is the compose service name, 8004 the
        #    in-container port.
        proxy_pass http://chatterbox-tts-server:8004;

        # 1.1 is required for keepalive to the upstream.
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # A long generation can run for many minutes without sending a byte.
        # The 60s default would drop the connection mid-synthesis.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Streaming audio responses must reach the client as they are produced,
        # not sit in a buffer until the whole clip is done.
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

# Optional HTTP -> HTTPS redirect.
#
# Only correct when HTTPS is published on 443: nginx cannot know which host port
# maps to this container, so it can't build a redirect to a non-standard port.
# If you set HTTPS_PORT=443, uncomment this and add "- 80:80" to the nginx ports.
